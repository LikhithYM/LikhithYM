<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="280">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Neural Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, sans-serif; }
    .pulsing-dot {
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="960" height="280" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Grid Texture Overlay -->
  <rect width="960" height="280" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Blurs (Atmospheric Glow) -->
  <circle cx="120" cy="70" r="130" fill="#0284c7" fill-opacity="0.12" filter="url(#cyanGlow)" />
  <circle cx="840" cy="140" r="150" fill="#6366f1" fill-opacity="0.1" filter="url(#cyanGlow)" />
  <circle cx="500" cy="240" r="100" fill="#00f2fe" fill-opacity="0.08" filter="url(#cyanGlow)" />

  <!-- Geometric Circuit Traces (Left & Right) -->
  <!-- Left Side Circuits -->
  <path d="M 0 100 L 90 100 L 130 140 L 220 140" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.4" />
  <circle cx="220" cy="140" r="3" fill="#00f2fe" filter="url(#softGlow)" />
  <path d="M 0 190 L 70 190 L 100 160 L 170 160" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3,3" />
  <circle cx="170" cy="160" r="2.5" fill="#38bdf8" />

  <!-- Right Side Neural Shield Constellation -->
  <g transform="translate(730, 45)">
    <!-- Shield Geometry Wireframe -->
    <polygon points="100,20 170,50 170,120 100,170 30,120 30,50" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <polygon points="100,35 155,60 155,115 100,155 45,115 45,60" fill="none" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="4,4" />
    
    <!-- Central Neural Node Lines -->
    <line x1="100" y1="20" x2="100" y2="170" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.5" />
    <line x1="30" y1="50" x2="170" y2="120" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.4" />
    <line x1="30" y1="120" x2="170" y2="50" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.4" />
    
    <!-- Constellation Nodes -->
    <circle cx="100" cy="20" r="3" fill="#00f2fe" filter="url(#softGlow)" />
    <circle cx="170" cy="50" r="3" fill="#38bdf8" />
    <circle cx="170" cy="120" r="3" fill="#00f2fe" />
    <circle cx="100" cy="170" r="3.5" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="30" cy="120" r="3" fill="#818cf8" />
    <circle cx="30" cy="50" r="3" fill="#38bdf8" />
    <circle cx="100" cy="95" r="4.5" fill="#ffffff" filter="url(#softGlow)" />
    
    <!-- Radiating Traces from Shield -->
    <path d="M 170 85 L 210 85 L 230 105" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="230" cy="105" r="2.5" fill="#00f2fe" />
    <path d="M 30 85 L 0 85" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
  </g>

  <!-- Corner HUD Accents -->
  <path d="M 24 40 L 24 24 L 40 24" fill="none" stroke="#00f2fe" stroke-width="2.5" />
  <path d="M 936 40 L 936 24 L 920 24" fill="none" stroke="#00f2fe" stroke-width="2.5" />
  <path d="M 24 240 L 24 256 L 40 256" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <path d="M 936 240 L 936 256 L 920 256" fill="none" stroke="#38bdf8" stroke-width="2.5" />

  <!-- TOP STATUS BADGE -->
  <g transform="translate(56, 38)">
    <rect width="320" height="26" rx="13" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#10b981" filter="url(#softGlow)" class="pulsing-dot" />
    <text x="26" y="17" fill="#10b981" class="mono" font-size="11" font-weight="600" letter-spacing="1">SYSTEM READY</text>
    <text x="125" y="17" fill="#64748b" class="mono" font-size="11">//</text>
    <text x="142" y="17" fill="#94a3b8" class="mono" font-size="11" letter-spacing="0.5">SECURE_KERNEL: ACTIVE</text>
  </g>

  <!-- MAIN NAME HEADLINE -->
  <text x="54" y="118" fill="url(#textGrad)" class="sans" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#softGlow)">
    LIKHITH Y M
  </text>

  <!-- PRIMARY IDENTITY PILL / SUBHEADLINE -->
  <g transform="translate(56, 134)">
    <text x="0" y="16" fill="#38bdf8" class="sans" font-size="15" font-weight="700" letter-spacing="1.5">SOFTWARE DEVELOPER</text>
    <text x="202" y="15" fill="#64748b" class="sans" font-size="14">◆</text>
    <text x="222" y="16" fill="#00f2fe" class="sans" font-size="15" font-weight="700" letter-spacing="1.5">AI &amp; AGENT SYSTEMS</text>
    <text x="408" y="15" fill="#64748b" class="sans" font-size="14">◆</text>
    <text x="428" y="16" fill="#a78bfa" class="sans" font-size="15" font-weight="700" letter-spacing="1.5">CYBERSECURITY</text>
  </g>

  <!-- TAGLINE / MANIFESTO -->
  <text x="56" y="185" fill="#94a3b8" class="sans" font-size="14.5" font-weight="400">
    Engineering autonomous agents, deterministic guardrails &amp; intelligent defensive software solutions.
  </text>

  <!-- BOTTOM TELEMETRY CHIPS -->
  <g transform="translate(56, 218)">
    <!-- Chip 1: Full-Stack -->
    <g transform="translate(0, 0)">
      <rect width="180" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="14" r="3" fill="#38bdf8" />
      <text x="24" y="18" fill="#e2e8f0" class="mono" font-size="11" font-weight="500">Full-Stack &amp; FastAPIs</text>
    </g>

    <!-- Chip 2: AI & LLMs -->
    <g transform="translate(192, 0)">
      <rect width="198" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="14" r="3" fill="#00f2fe" />
      <text x="24" y="18" fill="#e2e8f0" class="mono" font-size="11" font-weight="500">Autonomous Desktop Agents</text>
    </g>

    <!-- Chip 3: Threat Detection -->
    <g transform="translate(402, 0)">
      <rect width="206" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="14" r="3" fill="#a78bfa" />
      <text x="24" y="18" fill="#e2e8f0" class="mono" font-size="11" font-weight="500">ML Cyber Threat Detection</text>
    </g>

    <!-- Chip 4: Computer Vision -->
    <g transform="translate(620, 0)">
      <rect width="185" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="14" r="3" fill="#10b981" />
      <text x="24" y="18" fill="#e2e8f0" class="mono" font-size="11" font-weight="500">Vision &amp; ELA Forensics</text>
    </g>
  </g>
</svg>
